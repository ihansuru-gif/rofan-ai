<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이미지 뽑기 머신</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17233b;background:linear-gradient(145deg,#edf5ff,#fff);min-height:100vh}.app{width:min(1100px,100%);margin:auto;padding:24px}.head{margin-bottom:18px}.head h1{margin:0 0 6px;font-size:clamp(28px,5vw,46px)}.head p{margin:0;color:#72819a}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:#ffffffdf;border:1px solid #dce8f7;border-radius:26px;box-shadow:0 18px 50px #446b9a18}.machineCard{padding:24px}.stage{min-height:520px;display:grid;place-items:center}.machine{position:relative;width:380px;height:500px;transform-origin:50% 78%}.lid{position:absolute;z-index:5;top:7px;left:74px;width:232px;height:27px;border-radius:50%;background:linear-gradient(#fff,#7f8b96,#eef2f6,#697681);box-shadow:0 6px 9px #2343}.globe{position:absolute;z-index:2;top:25px;left:27px;width:326px;height:326px;border-radius:50%;overflow:hidden;border:5px solid #bfcedd;background:radial-gradient(circle at 32% 20%,#fffdfd,#dceeff9c 38%,#b9d8f45c);box-shadow:inset 0 -25px 45px #4b83b72b,0 12px 25px #3452}.shine{position:absolute;z-index:9;left:63px;top:38px;width:45px;height:150px;border-radius:50%;background:#ffffff7d;filter:blur(4px);transform:rotate(23deg)}.caps{position:absolute;inset:0}.cap{position:absolute;width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:inset -7px -8px 12px #16438820,0 4px 7px #1e395627;background:linear-gradient(145deg,#fff,#5b9bff)}.cap img{width:100%;height:100%;object-fit:cover}.cap.miss{background:linear-gradient(145deg,#fff,#e8edf3)}.cap.miss:after{content:"꽝";position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:900;color:#748196}.neck{position:absolute;z-index:3;top:337px;left:89px;width:202px;height:42px;border-radius:12px 12px 0 0;background:linear-gradient(90deg,#697580,#fff,#7d8994,#fff,#65727d)}.base{position:absolute;z-index:4;left:69px;top:368px;width:242px;height:128px;border:2px solid #aebac5;border-radius:16px 16px 28px 28px;background:linear-gradient(90deg,#cbd5df,#fff,#bfcad5,#fff,#b9c5d0);box-shadow:0 14px 22px #22394f2d}.knob{position:absolute;top:13px;left:72px;width:94px;height:94px;border:8px solid #82909b;border-radius:50%;background:radial-gradient(circle,#fff 0 48%,#c5d0da 49% 68%,#f5f7f9 69%);box-shadow:inset 0 0 0 3px #64717d,0 5px 9px #1d2e4435}.knob:after{content:"";position:absolute;left:15px;top:30px;width:48px;height:17px;border-radius:10px;border:3px solid #6f7b86;background:#cad4dc}.slot{position:absolute;right:16px;bottom:15px;width:48px;height:38px;border-radius:8px 8px 15px 15px;background:#303640;box-shadow:inset 0 5px 9px #0008}.drop{position:absolute;z-index:8;right:22px;bottom:57px;width:36px;height:36px;border-radius:50%;opacity:0;border:2px solid #fff;background:#5f99ff}.machine.go{animation:wobble 1s ease}.machine.go .knob{animation:turn .85s ease}.machine.go .cap{animation:chaos .38s ease-in-out infinite alternate}.drop.go{animation:drop .5s ease forwards}@keyframes turn{to{transform:rotate(360deg)}}@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}75%{transform:rotate(-.8deg)}}@keyframes chaos{from{translate:-5px 7px;rotate:-10deg}to{translate:7px -8px;rotate:14deg}}@keyframes drop{0%{opacity:0;transform:translateY(-50px) scale(.6)}20%{opacity:1}100%{opacity:1;transform:translateY(28px)}}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{min-width:90px;text-align:center;border:1px solid #dce8f7;background:#fff;border-radius:16px;padding:10px}.stat small{display:block;color:#7b899e}.stat b{font-size:20px}.draw{display:block;margin:15px auto 7px;min-width:250px;border:0;border-radius:999px;padding:17px 28px;font-size:21px;font-weight:900;color:#fff;background:linear-gradient(#4d8eff,#236af0);box-shadow:0 11px 25px #286cf34d}.draw:disabled{opacity:.45}.chance{text-align:center;margin:0;color:#74839a;font-size:13px}.side{display:flex;flex-direction:column;gap:14px}.panel{padding:20px}.panel h2{margin:0 0 13px;font-size:20px}.dropzone{display:flex;min-height:116px;border:2px dashed #b8cfef;border-radius:18px;align-items:center;justify-content:center;flex-direction:column;background:#f8fbff;cursor:pointer;color:#42617f}.dropzone.drag{border-color:#3278f6;background:#eef5ff}.dropzone strong{font-size:18px}.dropzone span{font-size:12px;color:#7c8ba0;margin-top:4px}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.thumb{position:relative;min-width:0}.thumb img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid #dbe7f4}.thumb button{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border:0;border-radius:50%;background:#17243a;color:#fff}.thumb div{font-size:9px;color:#77869b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}.stepper button,.stepper input{height:52px;border:1px solid #d9e6f5;border-radius:14px;background:#fff}.stepper button{font-size:25px;color:#3176f3}.stepper input{text-align:center;font-size:22px;font-weight:900;width:100%}.help{font-size:12px;color:#7a899d;margin:10px 0 0}.history{display:flex;gap:7px;overflow:auto}.hist{flex:0 0 65px;text-align:center}.hist img,.hist .hm{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#eef1f5}.hist .hm{display:grid;place-items:center;color:#7c8798;font-weight:900}.hist span{display:block;font-size:9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#78869a}.modal{position:fixed;inset:0;z-index:99;display:none;place-items:center;background:#1020399a;padding:16px}.modal.show{display:grid}.result{width:min(410px,100%);background:#fff;border-radius:28px;padding:25px;text-align:center;box-shadow:0 30px 80px #0005}.visual{width:min(290px,72vw);aspect-ratio:1;margin:10px auto 15px;border-radius:22px;overflow:hidden;border:1px solid #dce6f2;display:grid;place-items:center;background:#eef4fb}.visual img{width:100%;height:100%;object-fit:contain;background:#fff}.missbig{font-size:62px;font-weight:950;color:#8995a7;transform:rotate(-7deg)}.result h2{font-size:30px;margin:5px}.result p{color:#74839a;word-break:break-all}.again,.close{border:0;border-radius:999px;padding:13px 20px;font-weight:800}.again{background:#3479f5;color:#fff}.close{background:#eef2f7;color:#526075;margin-left:6px}@media(max-width:800px){.app{padding:14px}.grid{grid-template-columns:1fr}.machineCard{padding:12px}.stage{min-height:470px}.machine{transform:scale(.9);transform-origin:center top}.thumbs{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="head"><h1>🎰 이미지 뽑기 머신</h1><p>원하는 그림을 넣고, 꽝 개수도 마음대로 추가해서 랜덤으로 뽑아봐.</p></header>
<div class="grid">
<section class="card machineCard">
<div class="stage"><div class="machine" id="machine"><div class="lid"></div><div class="globe"><div class="shine"></div><div class="caps" id="caps"></div></div><div class="neck"></div><div class="base"><button class="knob" id="knob" aria-label="뽑기"></button><div class="drop" id="fall"></div><div class="slot"></div></div></div></div>
<div class="stats"><div class="stat"><small>총 캡슐</small><b id="total">0</b></div><div class="stat"><small>이미지</small><b id="imgs">0</b></div><div class="stat"><small>꽝</small><b id="misses">0</b></div></div>
<button class="draw" id="draw">✦ 뽑기 ✦</button><p class="chance" id="chance">이미지를 추가해줘.</p>
</section>
<aside class="side">
<section class="card panel"><h2>1. 이미지 넣기 <small id="count">0장</small></h2><label class="dropzone" id="zone"><input id="files" type="file" accept="image/*" multiple hidden><strong>＋ 이미지 추가</strong><span>여러 장 한꺼번에 가능</span></label><div class="thumbs" id="thumbs"></div></section>
<section class="card panel"><h2>2. 꽝 개수</h2><div class="stepper"><button id="minus">−</button><input id="miss" type="number" min="0" max="9999" value="0"><button id="plus">＋</button></div><p class="help">이미지 5장 + 꽝 5개면 꽝 확률 50%</p></section>
<section class="card panel"><h2>최근 결과</h2><div class="history" id="history"></div></section>
</aside></div></div>
<div class="modal" id="modal"><div class="result"><div class="visual" id="visual"></div><h2 id="resultTitle"></h2><p id="resultName"></p><button class="again" id="again">한 번 더</button><button class="close" id="close">닫기</button></div></div>
<script>
const $=s=>document.querySelector(s),S={images:[],miss:0,history:[],busy:false};
const E={machine:$('#machine'),caps:$('#caps'),fall:$('#fall'),files:$('#files'),zone:$('#zone'),thumbs:$('#thumbs'),miss:$('#miss'),total:$('#total'),imgs:$('#imgs'),misses:$('#misses'),count:$('#count'),chance:$('#chance'),draw:$('#draw'),knob:$('#knob'),history:$('#history'),modal:$('#modal'),visual:$('#visual'),title:$('#resultTitle'),name:$('#resultName')};
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('gachaDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function save(){try{let d=await openDB(),t=d.transaction('s','readwrite');t.objectStore('s').put(S.images,'images');t.objectStore('s').put(S.miss,'miss');t.objectStore('s').put(S.history.slice(0,15),'history');await new Promise((o,n)=>{t.oncomplete=o;t.onerror=n});d.close()}catch(e){}}
async function load(){try{let d=await openDB(),t=d.transaction('s'),g=k=>new Promise(o=>{let r=t.objectStore('s').get(k);r.onsuccess=()=>o(r.result)});let [i,m,h]=await Promise.all([g('images'),g('miss'),g('history')]);if(Array.isArray(i))S.images=i;if(Number.isFinite(m))S.miss=m;if(Array.isArray(h))S.history=h;d.close()}catch(e){}render()}
function data(file){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),name:file.name,data:r.result});r.onerror=no;r.readAsDataURL(file)})}
async function add(list){let f=[...list].filter(x=>x.type.startsWith('image/'));S.images.push(...await Promise.all(f.map(data)));await save();render()}
function render(){E.thumbs.innerHTML='';S.images.forEach(x=>{let d=document.createElement('div');d.className='thumb';d.innerHTML='<img><button>×</button><div></div>';d.querySelector('img').src=x.data;d.querySelector('div').textContent=x.name;d.querySelector('button').onclick=async()=>{S.images=S.images.filter(y=>y.id!==x.id);await save();render()};E.thumbs.append(d)});let total=S.images.length+S.miss;E.total.textContent=total;E.imgs.textContent=S.images.length;E.misses.textContent=S.miss;E.count.textContent=S.images.length+'장';E.miss.value=S.miss;E.draw.disabled=E.knob.disabled=!total||S.busy;if(!total)E.chance.textContent='이미지를 추가하거나 꽝을 설정해줘.';else E.chance.textContent=`이미지 ${Math.round(S.images.length/total*1000)/10}% · 꽝 ${Math.round(S.miss/total*1000)/10}%`;renderCaps();renderHistory()}
function renderCaps(){E.caps.innerHTML='';let total=S.images.length+S.miss,N=28,iw=total?S.images.length/total:0;for(let i=0;i<N;i++){let use=S.images.length&&Math.random()<iw,c=document.createElement('div');c.className='cap '+(use?'':'miss');let a=i/N*Math.PI*2+(i%4)*.3,r=45+(i%5)*25,x=163+Math.cos(a)*r-29,y=168+Math.sin(a)*r*.72-29+35;c.style.left=Math.max(5,Math.min(263,x))+'px';c.style.top=Math.max(60,Math.min(258,y))+'px';c.style.transform=`rotate(${i*31%48-24}deg)`;if(use){let im=document.createElement('img');im.src=S.images[i%S.images.length].data;c.append(im)}E.caps.append(c)}}
function renderHistory(){E.history.innerHTML='';if(!S.history.length){E.history.innerHTML='<span style="color:#8996a8;font-size:12px">아직 없음</span>';return}S.history.slice(0,10).forEach(x=>{let d=document.createElement('div');d.className='hist';if(x.type==='image'){let im=document.createElement('img');im.src=x.data;d.append(im)}else{let m=document.createElement('div');m.className='hm';m.textContent='꽝';d.append(m)}let s=document.createElement('span');s.textContent=x.type==='image'?x.name:'꽝';d.append(s);E.history.append(d)})}
async function go(){if(S.busy)return;let pool=S.images.map(x=>({type:'image',...x}));for(let i=0;i<S.miss;i++)pool.push({type:'miss'});if(!pool.length)return;S.busy=true;render();let result=pool[Math.floor(Math.random()*pool.length)];E.machine.classList.add('go');await new Promise(r=>setTimeout(r,900));E.fall.classList.remove('go');void E.fall.offsetWidth;E.fall.classList.add('go');await new Promise(r=>setTimeout(r,520));E.machine.classList.remove('go');S.busy=false;S.history.unshift(result.type==='image'?{type:'image',name:result.name,data:result.data}:{type:'miss'});await save();render();show(result)}
function show(r){E.visual.innerHTML='';if(r.type==='image'){let im=document.createElement('img');im.src=r.data;E.visual.append(im);E.title.textContent='당첨!';E.name.textContent=r.name}else{E.visual.innerHTML='<div class="missbig">꽝!</div>';E.title.textContent='꽝!';E.name.textContent='이번에는 빈 캡슐이 나왔어.'}E.modal.classList.add('show')}
E.files.onchange=async e=>{await add(e.target.files);e.target.value=''};['dragenter','dragover'].forEach(v=>E.zone.addEventListener(v,e=>{e.preventDefault();E.zone.classList.add('drag')}));['dragleave','drop'].forEach(v=>E.zone.addEventListener(v,e=>{e.preventDefault();E.zone.classList.remove('drag')}));E.zone.addEventListener('drop',e=>add(e.dataTransfer.files));$('#minus').onclick=async()=>{S.miss=Math.max(0,S.miss-1);await save();render()};$('#plus').onclick=async()=>{S.miss=Math.min(9999,S.miss+1);await save();render()};E.miss.onchange=async()=>{S.miss=Math.max(0,Math.min(9999,parseInt(E.miss.value)||0));await save();render()};E.draw.onclick=E.knob.onclick=go;$('#again').onclick=()=>{E.modal.classList.remove('show');go()};$('#close').onclick=()=>E.modal.classList.remove('show');E.modal.onclick=e=>{if(e.target===E.modal)E.modal.classList.remove('show')};load();
</script>
</body></html>

name: APK PC Tester Android Integration

on:
  pull_request:
    paths:
      - 'APK-PC-Tester/**'
      - '.github/workflows/apk-pc-tester-android-integration.yml'
  workflow_dispatch:

jobs:
  verify-virtual-phone-adb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot real Android and verify virtual phone controls
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu

            adb shell wm size 1080x2340
            adb shell wm density 440

            adb shell wm size | tee /tmp/wm-size.txt
            adb shell wm density | tee /tmp/wm-density.txt
            grep -q 'Override size: 1080x2340' /tmp/wm-size.txt
            grep -q 'Override density: 440' /tmp/wm-density.txt

            adb exec-out screencap -p > /tmp/apk-pc-tester-frame.png
            test "$(stat -c%s /tmp/apk-pc-tester-frame.png)" -gt 1000
            test "$(head -c 8 /tmp/apk-pc-tester-frame.png | xxd -p)" = '89504e470d0a1a0a'

            adb shell input tap 100 100
            adb shell input swipe 100 1200 900 1200 250
            adb shell input keyevent 3
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 1
            adb exec-out screencap -p > /tmp/apk-pc-tester-landscape.png
            test "$(stat -c%s /tmp/apk-pc-tester-landscape.png)" -gt 1000

            adb shell settings put system user_rotation 0
            adb shell wm size reset
            adb shell wm density reset
            adb shell wm size | tee /tmp/wm-size-reset.txt
            adb shell wm density | tee /tmp/wm-density-reset.txt
            ! grep -q 'Override size:' /tmp/wm-size-reset.txt
            ! grep -q 'Override density:' /tmp/wm-density-reset.txt

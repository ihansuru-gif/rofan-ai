name: WallpaperPadding v1.0.2 Full QA

on:
  push:
    branches:
      - wallpaper-padding-codex-qa-v102-build

permissions:
  contents: read

jobs:
  qa-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Reconstruct v1.0.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat .build/wallpaper-padding/part*.txt | base64 --decode > WallpaperPadding-v101.zip
          unzip -q WallpaperPadding-v101.zip
          test -f WallpaperPadding/settings.gradle

      - name: Apply and verify v1.0.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .build/wallpaper-padding-v102-patch/part*.txt | base64 --decode > v102.patch.gz
          echo 'cadaee6db4e0e75e7d91f5d8163b34db76b96fc40324c205d6d727c5b15e1aad  v102.patch.gz' | sha256sum -c -
          gzip -dc v102.patch.gz > v102.patch
          git apply --check v102.patch
          git apply v102.patch
          sha256sum -c .build/wallpaper-padding-v102-patch/manifest.sha256
          find WallpaperPadding -type f | sort > actual-files.txt
          awk '{print $2}' .build/wallpaper-padding-v102-patch/manifest.sha256 | sort > expected-files.txt
          diff -u expected-files.txt actual-files.txt
          git diff --check --no-index /dev/null v102.patch >/dev/null || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Core calculator QA x3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-classes
          javac -d qa-classes \
            WallpaperPadding/app/src/main/java/com/ihansuru/wallpaperpadding/ImageLayoutCalculator.java \
            WallpaperPadding/app/src/main/java/com/ihansuru/wallpaperpadding/DecodeSizeCalculator.java \
            WallpaperPadding/tools/LayoutCalculatorTest.java \
            WallpaperPadding/tools/DecodeSizeCalculatorTest.java \
            WallpaperPadding/tools/ExpectedScenarioTest.java
          for seed in 1101 2202 3303; do java -cp qa-classes LayoutCalculatorTest "$seed" 100000; done
          for n in 1 2 3; do java -cp qa-classes DecodeSizeCalculatorTest; done

      - name: Expected scenarios x3
        shell: bash
        run: |
          set -euo pipefail
          java -cp qa-classes ExpectedScenarioTest normal
          java -cp qa-classes ExpectedScenarioTest edge
          java -cp qa-classes ExpectedScenarioTest memory

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Android Lint
        working-directory: WallpaperPadding
        run: gradle --no-daemon :app:lintDebug

      - name: Build APK
        working-directory: WallpaperPadding
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK structure signature alignment permissions x3
        shell: bash
        run: |
          set -euo pipefail
          APK=WallpaperPadding/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$APK"
          for n in 1 2 3; do unzip -t "$APK" >/dev/null; done
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          "$BT/apksigner" verify --verbose "$APK" | tee apksigner.txt
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt
          "$BT/aapt" dump permissions "$APK" | tee apk-permissions.txt
          grep -q "package: name='com.ihansuru.wallpaperpadding' versionCode='3' versionName='1.0.2'" apk-badging.txt
          grep -q 'android.permission.SET_WALLPAPER' apk-permissions.txt
          ! grep -q 'android.permission.INTERNET' apk-permissions.txt
          ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' apk-permissions.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload validated APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperPadding-v1.0.2-validated-apk
          path: |
            WallpaperPadding/app/build/outputs/apk/debug/app-debug.apk
            WallpaperPadding/app/build/reports/lint-results-debug.html
            apksigner.txt
            apk-badging.txt
            apk-permissions.txt
            apk-sha256.txt
          if-no-files-found: error

  emulator-smoke:
    needs: qa-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: WallpaperPadding-v1.0.2-validated-apk
          path: qa-artifact

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator and API 29 image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-29;default;x86_64'
          echo no | avdmanager create avd -n WallpaperPaddingQA -k 'system-images;android-29;default;x86_64' --force

      - name: Boot emulator and smoke-test multiple display profiles
        shell: bash
        run: |
          set -euo pipefail
          APK=qa-artifact/app-debug.apk
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$EMULATOR" -avd WallpaperPaddingQA -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > emulator.log 2>&1 &
          "$ADB" wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          "$ADB" install -r "$APK"
          "$ADB" logcat -c
          for profile in '720x1280:320' '1080x2400:420' '1600x2560:320'; do
            size="${profile%%:*}"
            density="${profile##*:}"
            "$ADB" shell wm size "$size"
            "$ADB" shell wm density "$density"
            "$ADB" shell am force-stop com.ihansuru.wallpaperpadding
            "$ADB" shell am start -W -n com.ihansuru.wallpaperpadding/.MainActivity
            sleep 3
            pid="$($ADB shell pidof com.ihansuru.wallpaperpadding | tr -d '\r')"
            test -n "$pid"
            "$ADB" shell dumpsys activity activities | grep -q 'com.ihansuru.wallpaperpadding/.MainActivity'
            safe="${size}x${density}"
            "$ADB" exec-out screencap -p > "smoke-${safe}.png"
            test -s "smoke-${safe}.png"
          done
          "$ADB" logcat -d -t 1000 > smoke-logcat.txt
          if grep -E 'FATAL EXCEPTION|AndroidRuntime.*Process: com\.ihansuru\.wallpaperpadding' smoke-logcat.txt; then exit 1; fi

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperPadding-v1.0.2-emulator-smoke
          path: |
            smoke-*.png
            smoke-logcat.txt
            emulator.log
          if-no-files-found: error

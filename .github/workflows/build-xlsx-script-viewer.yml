name: Build XLSX Script Viewer APK
on:
  push:
    branches: [ "build/xlsx-script-viewer-apk" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: android-xlsx-script-viewer
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-xlsx-script-viewer/app/build/outputs/apk/debug/app-debug.apk SproutScriptViewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SproutScriptViewer-APK
          path: SproutScriptViewer.apk

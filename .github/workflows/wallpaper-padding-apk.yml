name: Build WallpaperPadding APK

on:
  push:
    branches:
      - wallpaper-padding-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project archive
        shell: bash
        run: |
          cat .build/wallpaper-padding/part*.txt | base64 --decode > WallpaperPadding-source.zip
          unzip -q WallpaperPadding-source.zip
          test -f WallpaperPadding/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        working-directory: WallpaperPadding
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperPadding-debug-apk
          path: WallpaperPadding/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Simple Screen Recorder Android QA

on:
  push:
    branches:
      - qa/simple-screen-recorder-v2
    paths:
      - 'ScreenRecorderQA/**'
      - '.github/workflows/screen-recorder-qa.yml'
  workflow_dispatch:

jobs:
  build-and-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect QA source
        id: source
        shell: bash
        run: |
          if [ -f ScreenRecorderQA/project.ready ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "QA source not uploaded yet; bootstrap run only."
          fi

      - name: Setup JDK 17
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        if: steps.source.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode project
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p qa-src
          cat ScreenRecorderQA/project.b64.part-* | base64 -d > qa-src/project.zip
          echo "8556a4bf15f17b3ee54adfcf7921b64b2895903bf14a230e9d03eee64a0bee5c  qa-src/project.zip" | sha256sum -c -
          unzip -q qa-src/project.zip -d qa-src
          python3 qa-src/simple-screen-recorder/tools/qa_structure.py

      - name: Build debug APK
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          gradle -p qa-src/simple-screen-recorder :app:assembleDebug --stacktrace
          test -s qa-src/simple-screen-recorder/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload built APK
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SimpleScreenRecorder-v2-debug-apk
          path: qa-src/simple-screen-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ensure ffprobe
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Real Android 15 emulator QA
        if: steps.source.outputs.present == 'true'
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            APP="com.bulbyeot.simplerecorder"
            ACT="$APP/.ui.MainActivity"
            APK="$GITHUB_WORKSPACE/qa-src/simple-screen-recorder/app/build/outputs/apk/debug/app-debug.apk"
            QA="$GITHUB_WORKSPACE/qa-output"
            mkdir -p "$QA"

            save_diag() {
              adb logcat -d > "$QA/logcat.txt" 2>&1 || true
              adb shell dumpsys activity services "$APP" > "$QA/services.txt" 2>&1 || true
              adb shell dumpsys window windows > "$QA/windows.txt" 2>&1 || true
              adb exec-out screencap -p > "$QA/final-screen.png" 2>/dev/null || true
              adb shell ls -l /sdcard/Movies/SimpleScreenRecorder > "$QA/movies-list.txt" 2>&1 || true
            }
            trap save_diag EXIT

            dump_ui() {
              local out="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml "$out" >/dev/null
            }

            tap_res() {
              local resid="$1"
              dump_ui "$QA/ui-current.xml"
              local coords
              coords=$(python3 - "$QA/ui-current.xml" "$resid" <<'PY'
import re, sys, xml.etree.ElementTree as ET
root=ET.parse(sys.argv[1]).getroot()
want=sys.argv[2]
for n in root.iter("node"):
    rid=n.attrib.get("resource-id","")
    if rid==want or rid.endswith("/"+want):
        m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib.get("bounds",""))
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            print((x1+x2)//2,(y1+y2)//2)
            raise SystemExit
raise SystemExit(3)
PY
              )
              adb shell input tap $coords
            }

            tap_text_any() {
              local regex="$1"
              dump_ui "$QA/ui-current.xml"
              local coords
              coords=$(python3 - "$QA/ui-current.xml" "$regex" "$APP" <<'PY'
import re, sys, xml.etree.ElementTree as ET
root=ET.parse(sys.argv[1]).getroot()
rx=re.compile(sys.argv[2],re.I)
app=sys.argv[3]
candidates=[]
for n in root.iter("node"):
    text=(n.attrib.get("text","")+" "+n.attrib.get("content-desc","")).strip()
    pkg=n.attrib.get("package","")
    rid=n.attrib.get("resource-id","")
    if rx.search(text) or rx.search(rid):
        m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib.get("bounds",""))
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            score=0 if pkg!=app else 10
            if rid.endswith("button1") or "start_now" in rid.lower(): score-=5
            candidates.append((score,(x1+x2)//2,(y1+y2)//2,text,pkg,rid))
if not candidates:
    raise SystemExit(4)
candidates.sort()
_,x,y,*_=candidates[0]
print(x,y)
PY
              )
              adb shell input tap $coords
            }

            allow_projection() {
              sleep 1
              dump_ui "$QA/projection-dialog.xml"
              adb exec-out screencap -p > "$QA/projection-dialog.png"
              tap_text_any 'Start now|Start recording|Share screen|지금 시작|녹화 시작|화면 공유|android:id/button1|start_now'
            }

            assert_service_running() {
              adb shell dumpsys activity services "$APP" | tee "$QA/service-running.txt"
              grep -q "ScreenRecordService" "$QA/service-running.txt"
            }

            start_recording_cycle() {
              adb shell am start -W -n "$ACT" >/dev/null
              sleep 1
              tap_res "$APP:id/startButton"
              allow_projection
              sleep 3
              assert_service_running
            }

            adb shell wm size 720x1600
            adb shell wm density 320

            adb install -r "$APK" | tee "$QA/install.txt"
            grep -q "Success" "$QA/install.txt"
            adb shell pm grant "$APP" android.permission.RECORD_AUDIO
            adb shell pm grant "$APP" android.permission.POST_NOTIFICATIONS || true
            adb shell appops set "$APP" SYSTEM_ALERT_WINDOW allow || adb shell appops set "$APP" android:system_alert_window allow
            adb shell appops get "$APP" SYSTEM_ALERT_WINDOW | tee "$QA/overlay-appop.txt"

            adb logcat -c
            adb shell am start -W -n "$ACT" | tee "$QA/launch.txt"
            sleep 1
            dump_ui "$QA/01-start.xml"
            adb exec-out screencap -p > "$QA/01-start.png"
            grep -q "$APP:id/startButton" "$QA/01-start.xml"

            # First full cycle: mic + overlay + marker + drawing + rotation + save.
            tap_res "$APP:id/startButton"
            allow_projection
            sleep 3
            assert_service_running
            dump_ui "$QA/02-recording.xml"
            adb exec-out screencap -p > "$QA/02-recording.png"

            adb shell input keyevent 3
            sleep 1
            dump_ui "$QA/03-home-toolbar.xml"
            adb exec-out screencap -p > "$QA/03-home-toolbar.png"

            # Expand toolbar; prefer semantic text, fall back to its default coordinate.
            if ! tap_text_any '^●$'; then adb shell input tap 630 290; fi
            sleep 0.5
            dump_ui "$QA/04-toolbar-open.xml"
            adb exec-out screencap -p > "$QA/04-toolbar-open.png"

            # Quick marker and capture it while visible.
            if ! tap_text_any '^◎$'; then adb shell input tap 285 390; fi
            sleep 0.2
            adb shell input tap 360 800
            sleep 0.2
            adb exec-out screencap -p > "$QA/05-quick-marker.png"
            sleep 1.7

            # Drawing mode, draw a line, then close drawing.
            if ! tap_text_any '^●$'; then adb shell input tap 630 290; fi
            sleep 0.3
            if ! tap_text_any '^✎$'; then adb shell input tap 380 390; fi
            sleep 0.3
            adb shell input swipe 140 700 560 700 400
            adb exec-out screencap -p > "$QA/06-drawing.png"
            if ! tap_text_any '✎✓|^✎$'; then adb shell input tap 380 390; fi
            sleep 0.5

            # Underlying UI remains usable after drawing overlay removal; rotate while recording.
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 2
            assert_service_running
            adb exec-out screencap -p > "$QA/07-rotated.png"
            adb shell settings put system user_rotation 0
            sleep 1
            assert_service_running

            # Stop from floating toolbar.
            if ! tap_text_any '^●$'; then adb shell input tap 630 290; fi
            sleep 0.3
            if ! tap_text_any '^■$'; then adb shell input tap 570 390; fi
            sleep 5

            adb shell dumpsys activity services "$APP" > "$QA/service-after-stop.txt"
            if grep -q "ScreenRecordService" "$QA/service-after-stop.txt"; then
              echo "Service still running after stop" >&2
              exit 31
            fi

            adb shell ls -lt /sdcard/Movies/SimpleScreenRecorder | tee "$QA/movies-first.txt"
            FIRST=$(adb shell 'ls -t /sdcard/Movies/SimpleScreenRecorder/SSR_*.mp4 2>/dev/null | head -1' | tr -d '\r')
            test -n "$FIRST"
            adb pull "$FIRST" "$QA/first-recording.mp4"
            test "$(stat -c%s "$QA/first-recording.mp4")" -gt 5000
            ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 "$QA/first-recording.mp4" | tee "$QA/ffprobe-first.txt"
            grep -Eq 'h264,video|video,h264' "$QA/ffprobe-first.txt"
            grep -Eq 'aac,audio|audio,aac' "$QA/ffprobe-first.txt"

            # Second cycle proves session cleanup/restart works.
            adb shell am start -W -n "$ACT" >/dev/null
            sleep 1
            tap_res "$APP:id/startButton"
            allow_projection
            sleep 2
            assert_service_running
            adb shell am start -W -n "$ACT" >/dev/null
            sleep 1
            tap_res "$APP:id/stopButton"
            sleep 4

            COUNT=$(adb shell 'ls /sdcard/Movies/SimpleScreenRecorder/SSR_*.mp4 2>/dev/null | wc -l' | tr -d '\r')
            echo "recording_count=$COUNT" | tee "$QA/repeat-count.txt"
            test "$COUNT" -ge 2

            adb logcat -d > "$QA/logcat-final.txt"
            if grep -E "FATAL EXCEPTION|ANR in $APP" "$QA/logcat-final.txt"; then
              echo "Crash or ANR detected" >&2
              exit 41
            fi

            adb shell wm size reset
            adb shell wm density reset
            echo "ANDROID_EMULATOR_QA_PASS" | tee "$QA/result.txt"

      - name: Upload emulator QA evidence
        if: always() && steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SimpleScreenRecorder-v2-emulator-qa
          path: qa-output/
          if-no-files-found: warn

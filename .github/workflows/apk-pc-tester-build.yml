name: Build APK PC Tester

on:
  push:
    paths:
      - 'APK-PC-Tester/**'
      - '.github/workflows/apk-pc-tester-build.yml'
  pull_request:
    paths:
      - 'APK-PC-Tester/**'
      - '.github/workflows/apk-pc-tester-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore APK-PC-Tester/src/ApkPcTester/ApkPcTester.csproj

      - name: Build
        run: dotnet build APK-PC-Tester/src/ApkPcTester/ApkPcTester.csproj -c Release --no-restore

      - name: Publish single EXE
        run: dotnet publish APK-PC-Tester/src/ApkPcTester/ApkPcTester.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/APK-PC-Tester

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: APK-PC-Tester-win-x64
          path: artifacts/APK-PC-Tester/APK-PC-Tester.exe
          if-no-files-found: error

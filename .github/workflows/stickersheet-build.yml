name: StickerSheetMaker Android Build

on:
  push:
    branches:
      - stickersheet-build-20260822
    paths:
      - 'StickerSheetMaker/**'
      - '.github/workflows/stickersheet-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'StickerSheetMaker/**'
      - '.github/workflows/stickersheet-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Lint and build debug APK
        working-directory: StickerSheetMaker
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StickerSheetMaker-v0.3.0-debug-apk
          path: StickerSheetMaker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StickerSheetMaker-lint-report
          path: StickerSheetMaker/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

name: Temporary WallpaperPadding v1.0.1 QA Build

on:
  pull_request:
    branches:
      - main
    paths:
      - '.build/wallpaper-padding/**'
      - '.github/workflows/wallpaper-padding-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Reconstruct project archive
        shell: bash
        run: |
          cat .build/wallpaper-padding/part*.txt | base64 --decode > WallpaperPadding-source.zip
          unzip -q WallpaperPadding-source.zip
          test -f WallpaperPadding/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Core QA pass x3
        shell: bash
        run: |
          mkdir -p qa-classes
          javac -d qa-classes \
            WallpaperPadding/app/src/main/java/com/ihansuru/wallpaperpadding/ImageLayoutCalculator.java \
            WallpaperPadding/app/src/main/java/com/ihansuru/wallpaperpadding/DecodeSizeCalculator.java \
            WallpaperPadding/tools/LayoutCalculatorTest.java \
            WallpaperPadding/tools/DecodeSizeCalculatorTest.java \
            WallpaperPadding/tools/ExpectedScenarioTest.java
          for seed in 1101 2202 3303; do java -cp qa-classes LayoutCalculatorTest "$seed" 100000; done
          for n in 1 2 3; do java -cp qa-classes DecodeSizeCalculatorTest; done

      - name: Expected scenarios x3
        shell: bash
        run: |
          java -cp qa-classes ExpectedScenarioTest normal
          java -cp qa-classes ExpectedScenarioTest edge
          java -cp qa-classes ExpectedScenarioTest memory

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        working-directory: WallpaperPadding
        run: gradle --no-daemon :app:assembleDebug

      - name: APK archive check x3
        shell: bash
        run: |
          APK=WallpaperPadding/app/build/outputs/apk/debug/app-debug.apk
          file "$APK" | grep -q 'Android package'
          for n in 1 2 3; do unzip -t "$APK" >/dev/null; done
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperPadding-v1.0.1-debug-apk
          path: WallpaperPadding/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

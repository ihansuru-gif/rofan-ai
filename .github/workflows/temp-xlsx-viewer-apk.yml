name: Temporary XLSX Viewer APK Builder
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'android-xlsx-script-viewer/**'
      - '.github/workflows/temp-xlsx-viewer-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - working-directory: android-xlsx-script-viewer
        run: gradle assembleDebug --stacktrace
      - run: cp android-xlsx-script-viewer/app/build/outputs/apk/debug/app-debug.apk SproutScriptViewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SproutScriptViewer-APK
          path: SproutScriptViewer.apk

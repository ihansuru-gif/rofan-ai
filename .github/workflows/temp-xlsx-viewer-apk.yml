name: Temporary XLSX Viewer APK Builder
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/temp-xlsx-viewer-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/xlsx-script-viewer-apk2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - working-directory: android-xlsx-script-viewer
        run: gradle assembleDebug --stacktrace
      - name: Export APK chunks
        run: |
          rm -rf apk-output
          mkdir apk-output
          cp android-xlsx-script-viewer/app/build/outputs/apk/debug/app-debug.apk apk-output/SproutScriptViewer.apk
          sha256sum apk-output/SproutScriptViewer.apk > apk-output/SHA256.txt
          base64 -w 0 apk-output/SproutScriptViewer.apk | split -b 400000 - apk-output/part-
          rm apk-output/SproutScriptViewer.apk
          ls apk-output/part-* | sed 's#apk-output/##' > apk-output/MANIFEST.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-output
          git commit -m "Build SproutScriptViewer APK output"
          git push origin HEAD:build/xlsx-script-viewer-apk2

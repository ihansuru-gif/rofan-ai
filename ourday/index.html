<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>우리의 하루 · 웹 체험</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#2d3956}body{background:#faf7f3}header{height:52px;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.4px}main{width:min(100%,500px);margin:0 auto;padding:0 8px 34px}#toy{position:relative;width:min(100%,420px);aspect-ratio:420/584;margin:0 auto;user-select:none}#shell{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#center{position:absolute;left:26.2%;top:36.0%;width:47.6%;height:27.8%;background:#edf4f1;overflow:hidden;text-align:center;padding:7px 8px 5px;font-size:12px;line-height:1.42}#center h2{font-size:15px;margin:0 0 5px}#center p{margin:4px 0}#sprite{width:80px;height:80px;object-fit:contain;image-rendering:pixelated;display:block;margin:1px auto -1px}#message{font-weight:700;font-size:11px;min-height:30px}.menuhit{position:absolute;width:13.3%;height:9.2%;border:0;background:transparent;padding:0;cursor:pointer}.menuhit.sel{outline:3px solid #9b8abe;outline-offset:-5px;border-radius:7px}#m0{left:25.0%;top:26.6%}#m1{left:38.5%;top:26.6%}#m2{left:52.0%;top:26.6%}#m3{left:65.5%;top:26.6%}#m4{left:25.0%;top:64.6%}#m5{left:38.5%;top:64.6%}#m6{left:52.0%;top:64.6%}#m7{left:65.5%;top:64.6%}.hw{position:absolute;width:17.5%;aspect-ratio:1;border:0;background:#a99acb;border-radius:50%;box-shadow:inset 0 -4px 0 #8272aa;padding:0;cursor:pointer;color:white;font-weight:900;font-size:20px}.hw:active{transform:translateY(2px) scale(.96)}#A{left:20.3%;top:80.2%}#B{left:41.3%;top:82.0%}#C{left:62.3%;top:80.2%}#hint{text-align:center;font-size:12px;margin:-6px 0 5px;color:#6d6784;min-height:20px}#test{text-align:center;font-size:12px;line-height:2.1;margin-top:2px}#test button{border:0;background:transparent;color:#66558d;text-decoration:underline;text-underline-offset:3px;padding:4px 7px;cursor:pointer}#test small{display:block;color:#9a93a7;text-decoration:none}.line{display:flex;justify-content:space-between;gap:5px;margin:5px 0;text-align:left}.hearts{letter-spacing:1px;color:#4a5270;white-space:nowrap}.list{text-align:left;margin:0 auto;max-width:150px}.list div{padding:2px 0}.pick{font-weight:900}.tiny{font-size:10px;color:#536779}.ending{font-size:14px;font-weight:900;margin-top:3px}.shell-art{position:absolute;inset:7% 8% 7% 8%;background:#eee6d7;border:4px solid #6f7198;border-radius:46% 46% 45% 45% / 42% 42% 50% 50%;box-shadow:0 8px 24px #9086a733}.screen-frame{position:absolute;left:20%;right:20%;top:23%;height:48%;background:#6f7198;border-radius:16px}.screen-inner{position:absolute;inset:7px;background:#edf4f1;border-radius:10px}.brand{position:absolute;top:13%;left:0;right:0;text-align:center;color:#665a8e;font-weight:900;font-size:18px}.decor{position:absolute;color:#a99acb;font-size:20px}.d1{left:11%;top:11%}.d2{right:13%;top:14%}.d3{left:10%;bottom:13%}@media(max-width:380px){header{height:40px;font-size:14px}main{padding:0 2px 20px}#center{font-size:10px;padding:5px}#center h2{font-size:13px}#sprite{width:68px;height:68px}#message{font-size:10px}#hint,#test{font-size:11px}}
</style></head><body><header>✧ 우리의 하루 · 서버 없는 웹 체험</header><main><div id="toy" tabindex="0" aria-label="A 선택, B 확인, C 뒤로"><div class="shell-art"></div><div class="screen-frame"><div class="screen-inner"></div></div><div class="brand">우리의 하루</div><span class="decor d1">☆</span><span class="decor d2">♡</span><span class="decor d3">✦</span><div id="center"></div><button class="menuhit" id="m0" aria-label="상태"></button><button class="menuhit" id="m1" aria-label="식사"></button><button class="menuhit" id="m2" aria-label="씻기기"></button><button class="menuhit" id="m3" aria-label="휴식"></button><button class="menuhit" id="m4" aria-label="활동"></button><button class="menuhit" id="m5" aria-label="성장"></button><button class="menuhit" id="m6" aria-label="결말"></button><button class="menuhit" id="m7" aria-label="설정"></button><button class="hw" id="A" aria-label="A 선택">A</button><button class="hw" id="B" aria-label="B 확인">B</button><button class="hw" id="C" aria-label="C 뒤로">C</button></div><div id="hint"></div><div id="test"><button id="fans">가상 팬 3명</button><button id="day">하루 넘기기</button><button id="finish">엔딩까지</button><button id="reset">처음부터</button><small>지금은 한 브라우저 안의 체험판이에요. 실제 팬 공동 상태는 서버 연결 때 붙입니다.</small></div></main><script>
const SPRITES={baby:`data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" fill="none"/><circle cx="48" cy="53" r="27" fill="#f5d8c7" stroke="#504967" stroke-width="3"/><path d="M22 46 Q28 18 50 19 Q73 20 75 46 Q67 35 60 35 Q47 42 22 46" fill="#3d3a50"/><circle cx="39" cy="54" r="2.5"/><circle cx="57" cy="54" r="2.5"/><path d="M43 65 Q48 68 53 65" fill="none" stroke="#504967" stroke-width="2"/><rect x="30" y="74" width="36" height="16" rx="10" fill="#a99acb"/></svg>')}`,child:`data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><circle cx="48" cy="49" r="25" fill="#f5d8c7" stroke="#504967" stroke-width="3"/><path d="M22 45 Q29 17 52 18 Q73 21 74 45 Q61 35 57 33 Q45 41 22 45" fill="#3d3a50"/><circle cx="39" cy="51" r="2.5"/><circle cx="57" cy="51" r="2.5"/><path d="M44 62 Q48 65 52 62" fill="none" stroke="#504967" stroke-width="2"/><path d="M29 73 Q48 65 67 73 L70 94 H26Z" fill="#9a8ec0"/></svg>')}`,teen:`data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><circle cx="48" cy="45" r="23" fill="#f5d8c7" stroke="#504967" stroke-width="3"/><path d="M24 43 Q28 14 51 16 Q72 19 72 43 Q61 34 56 31 Q45 39 24 43" fill="#3d3a50"/><circle cx="39" cy="47" r="2.5"/><circle cx="57" cy="47" r="2.5"/><path d="M44 58 Q48 61 52 58" fill="none" stroke="#504967" stroke-width="2"/><path d="M27 69 Q48 61 69 69 L73 94 H23Z" fill="#8e82b6"/></svg>')}`,adult:`data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><circle cx="48" cy="43" r="22" fill="#f5d8c7" stroke="#504967" stroke-width="3"/><path d="M25 42 Q29 13 52 15 Q72 18 71 42 Q61 33 56 30 Q45 38 25 42" fill="#3d3a50"/><circle cx="39" cy="45" r="2.5"/><circle cx="57" cy="45" r="2.5"/><path d="M44 56 Q48 59 52 56" fill="none" stroke="#504967" stroke-width="2"/><path d="M25 67 Q48 59 71 67 L75 94 H21Z" fill="#8276ab"/></svg>')}`};
const MENU=['상태','식사','씻기기','휴식','활동','성장','결말','설정'];const ACT=[['놀아주기','play'],['책 읽기','study'],['노래하기','sing'],['운동하기','exercise']];const DUR=600000,SIMDAY=DUR/7,KEY='ourday-lite-v1';const fresh=()=>({elapsed:0,last:Date.now(),needs:{satiety:78,mood:75,clean:82,energy:76},dir:{play:0,study:0,sing:0,exercise:0,rest:0},actions:0,ended:false,ending:null,sound:true});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}let screen='home',sel=0,sub=0,msg='A로 고르고, B로 열어봐요.';const clamp=n=>Math.max(0,Math.min(100,n));function tick(){if(!s.ended){let n=Date.now(),dt=Math.max(0,Math.min(5000,n-s.last));s.elapsed+=dt;s.last=n;let k=dt/SIMDAY;s.needs.satiety=clamp(s.needs.satiety-k*10);s.needs.mood=clamp(s.needs.mood-k*7);s.needs.clean=clamp(s.needs.clean-k*7);s.needs.energy=clamp(s.needs.energy-k*9);if(s.elapsed>=DUR)end();save()}render()}function stage(){let p=s.elapsed/DUR;return p>=1?'adult':p>=.6?'teen':p>=.25?'child':'baby'}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function act(id){if(s.ended){msg='이번 육성은 끝났어요.';return}let n=s.needs;if(id==='feed'){n.satiety=clamp(n.satiety+18);msg='냠냠, 잘 먹었어요!'}if(id==='clean'){n.clean=clamp(n.clean+22);msg='깨끗해졌어요!'}if(id==='rest'){n.energy=clamp(n.energy+18);s.dir.rest++;msg='푹 쉬었어요.'}if(id==='play'){n.mood=clamp(n.mood+13);n.energy=clamp(n.energy-3);s.dir.play++;msg='신나게 놀았어요!'}if(id==='study'){n.energy=clamp(n.energy-5);s.dir.study++;msg='함께 책을 읽었어요.'}if(id==='sing'){n.mood=clamp(n.mood+5);n.energy=clamp(n.energy-4);s.dir.sing++;msg='노래를 불렀어요 ♪'}if(id==='exercise'){n.energy=clamp(n.energy-6);n.satiety=clamp(n.satiety-3);s.dir.exercise++;msg='열심히 움직였어요!'}s.actions++;save();screen='home'}function end(){s.elapsed=DUR;s.ended=true;let d=s.dir,total=Object.values(d).reduce((a,b)=>a+b,0);let title='자기 길을 찾았다!',copy='함께 보낸 시간대로 자기만의 길을 골랐다.';if(total<3){title='느긋한 어른이 되었다!';copy='서두르지 않는 하루를 배웠다.'}else{let x=Object.entries(d).sort((a,b)=>b[1]-a[1]);let [a,av]=x[0],[b,bv]=x[1];if((a==='rest'||a==='play')&&(d.rest+d.play)/total>.62){title='백수가 되었다!';copy='팬들이 쉬는 법을 너무 잘 가르쳤다. 출근보다 낮잠에 진심이다.'}else if(d.study/total>.48){title='교수가 되었다!';copy='책과 질문이 쌓여 연구하는 어른이 되었다.'}else if(d.sing/total>.48){title='가수가 되었다!';copy='매일의 노래가 무대까지 이어졌다.'}else if(d.exercise/total>.48){title='운동선수가 되었다!';copy='꾸준히 움직인 시간이 힘이 되었다.'}else if(d.study+d.sing>total*.64){title='작곡가가 되었다!';copy='배운 것과 노래를 엮어 곡을 만들기 시작했다.'}else if(d.play/total>.42){title='프로게이머가 되었다!';copy='노는 데 누구보다 진심인 어른이 되었다.'}else if(d.play+d.sing>total*.62){title='엔터테이너가 되었다!';copy='놀고 노래한 시간이 사람을 웃게 하는 일이 되었다.'}else if(d.rest/total>.4){title='여유로운 어른이 되었다!';copy='잘 쉬는 것도 재능이라는 걸 배웠다.'}}s.ending={title,copy};screen='ending';save()}function hearts(v){let n=Math.round(v/20);return '♥'.repeat(n)+'♡'.repeat(5-n)}function home(){return `<h2>하루 · ${{baby:'아기',child:'어린이',teen:'청소년',adult:'성체'}[stage()]}</h2><img id="sprite" src="${SPRITES[stage()]}" alt="현재 성장 단계"><div id="message">${msg}</div><div class="tiny">${Math.min(7,Math.floor(s.elapsed/SIMDAY)+1)}일차 · ${Math.min(100,Math.floor(s.elapsed/DUR*100))}%</div>`}function renderCenter(){if(screen==='home')return home();if(screen==='status')return `<h2>상태</h2>${[['배부름',s.needs.satiety],['기분',s.needs.mood],['청결',s.needs.clean],['기력',s.needs.energy]].map(x=>`<div class="line"><span>${x[0]}</span><span class="hearts">${hearts(x[1])}</span></div>`).join('')}`;if(screen==='feed')return `<h2>식사하기</h2><img id="sprite" src="${SPRITES[stage()]}"><p>밥을 줄까요?</p><b>B 확인 · C 취소</b>`;if(screen==='clean')return `<h2>씻기기</h2><img id="sprite" src="${SPRITES[stage()]}"><p>깨끗하게 씻겨줄까요?</p><b>B 확인 · C 취소</b>`;if(screen==='rest')return `<h2>휴식</h2><img id="sprite" src="${SPRITES[stage()]}"><p>잠깐 쉬게 할까요?</p><b>B 확인 · C 취소</b>`;if(screen==='activity')return `<h2>활동</h2><div class="list">${ACT.map((x,i)=>`<div class="${i===sub?'pick':''}">${i===sub?'▶ ':''}${x[0]}</div>`).join('')}</div><p class="tiny">A 이동 · B 실행</p>`;if(screen==='growth'){let p=Math.min(100,Math.floor(s.elapsed/DUR*100));return `<h2>성장 과정</h2><img id="sprite" src="${SPRITES[stage()]}"><p>아기 → 어린이 → 청소년 → 성체</p><b>${p}%</b><p class="tiny">${'■'.repeat(Math.floor(p/10))+'□'.repeat(10-Math.floor(p/10))}</p>`}if(screen==='ending'){return s.ended?`<h2>엔딩</h2><img id="sprite" src="${SPRITES.adult}"><div class="ending">${s.ending.title}</div><p>${s.ending.copy}</p>`:`<h2>결말</h2><img id="sprite" src="${SPRITES[stage()]}"><p>아직 자라고 있어요.</p><span class="tiny">전체 육성이 끝나면 한 가지 공동 결말이 정해져요.</span>`}if(screen==='settings')return `<h2>설정</h2><div class="list"><div class="pick">▶ 소리 ${s.sound?'ON':'OFF'}</div><div>도움말</div></div><p class="tiny">B로 소리 전환</p>`;return home()}function render(){document.getElementById('center').innerHTML=renderCenter();for(let i=0;i<8;i++)document.getElementById('m'+i).classList.toggle('sel',screen==='home'&&i===sel);document.getElementById('hint').textContent=screen==='home'?`선택: ${MENU[sel]} · A 다음 / B 열기 / C 홈`:`${MENU[sel]||''} · C로 돌아가기`}function A(){if(screen==='home')sel=(sel+1)%8;else if(screen==='activity')sub=(sub+1)%ACT.length;render()}function B(){if(screen==='home'){screen=['status','feed','clean','rest','activity','growth','ending','settings'][sel]}else if(screen==='feed')act('feed');else if(screen==='clean')act('clean');else if(screen==='rest')act('rest');else if(screen==='activity')act(ACT[sub][1]);else if(screen==='settings'){s.sound=!s.sound;save()}render()}function C(){screen='home';render()}document.getElementById('A').onclick=A;document.getElementById('B').onclick=B;document.getElementById('C').onclick=C;for(let i=0;i<8;i++)document.getElementById('m'+i).onclick=()=>{sel=i;screen='home';render()};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='a'||e.key==='ArrowRight')A();if(e.key.toLowerCase()==='b'||e.key==='Enter')B();if(e.key.toLowerCase()==='c'||e.key==='Escape')C()});document.getElementById('fans').onclick=()=>{for(let i=0;i<3;i++){let ids=['play','study','sing','exercise','rest'];act(ids[Math.floor(Math.random()*ids.length)])}msg='가상 팬 3명이 함께 돌봤어요.';screen='home';render()};document.getElementById('day').onclick=()=>{s.elapsed=Math.min(DUR,s.elapsed+SIMDAY);if(s.elapsed>=DUR)end();else{msg='하루를 앞당겼어요.';screen='home'}save();render()};document.getElementById('finish').onclick=()=>{for(let i=0;i<18;i++){s.dir.play++;s.dir.rest++;s.actions+=2}end();render()};document.getElementById('reset').onclick=()=>{s=fresh();screen='home';sel=0;sub=0;msg='A로 고르고, B로 열어봐요.';save();render()};setInterval(tick,1000);tick();
</script></body></html>
